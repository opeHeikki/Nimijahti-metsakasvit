<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nimijahti / metsäkasvit</title>
  <style>
    :root {
      --duolingo-green: #58cc02;
      --duolingo-dark-green: #46a302;
      --duolingo-blue: #1cb0f6;
      --duolingo-gray: #e5e5e5;
      --duolingo-card-border: #bce0fd;
      --duolingo-wrong: #ff4b4b;
      --duolingo-wrong-bg: #ffdfe0;
      --duolingo-correct-bg: #d7ffb8;
      --btn-width: 180px;
    }

    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'din-round', system-ui, -apple-system, sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #3c3c3c;
      touch-action: manipulation;
    }

    @keyframes varivilkutus {
      0% { background-color: #ff4b4b; }
      20% { background-color: #58cc02; }
      40% { background-color: #1cb0f6; }
      60% { background-color: #ffc800; }
      80% { background-color: #ce82ff; }
      100% { background-color: #ff4b4b; }
    }

    body.flashing {
      animation: varivilkutus 3.5s linear infinite;
    }

    body.flashing #game-container {
      background-color: transparent;
      box-shadow: none;
    }

    #game-container {
      width: 100%;
      max-width: 900px;
      height: 100%;
      max-height: 700px;
      padding: 12px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--duolingo-gray);
      flex-shrink: 0;
    }

    h1 {
      font-size: 20px;
      margin: 0;
      color: var(--duolingo-dark-green);
      font-weight: 800;
    }

    .stats {
      display: flex;
      gap: 16px;
      font-weight: 700;
      font-size: 17px;
    }

    #timer { color: var(--duolingo-blue); }
    #score { color: var(--duolingo-green); }

    #game-board {
      display: flex;
      gap: 12px;
      flex: 1;
      min-height: 0;
      align-items: stretch;
    }

    .image-container {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fafafa;
      border: 2px solid var(--duolingo-gray);
      border-radius: 12px;
      overflow: hidden;
      padding: 6px;
    }

    #plant-image {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      opacity: 0;
      transition: none;
    }

    #plant-image.visible {
      opacity: 1;
      transition: opacity 1s ease-in-out;
    }

    .names-container {
      width: var(--btn-width);
      height: 50%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .name-btn {
      width: 100%;
      flex: 1;
      min-height: 0;
      background: linear-gradient(to right, #b3d9ff, #f0f7ff);
      border: 1px solid var(--duolingo-card-border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, opacity 0.4s ease-in-out;
      padding: 0 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .name-btn.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .name-btn:active {
      transform: translateY(1px);
    }

    .name-btn.wrong-flash {
      background: var(--duolingo-wrong-bg) !important;
      border-color: var(--duolingo-wrong) !important;
      color: #d32f2f;
    }

    .name-btn.correct-reveal {
      background: var(--duolingo-green) !important;
      border-color: var(--duolingo-dark-green) !important;
      color: white !important;
    }

    /* Kännykkäoptimointi */
    @media (max-width: 768px) {
      #game-board {
        flex-direction: column;
        gap: 8px;
      }

      .image-container {
        flex: 1;
        width: 100%;
        height: 50%;
      }

      .names-container {
        width: 100% !important;
        flex: 1;
        height: 50%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(3, 1fr);
        gap: 4px;
      }

      .name-btn {
        width: 100%;
        height: 100%;
        white-space: normal;
        line-height: 1.15;
        font-size: 26px;
        padding: 2px 4px;
      }
    }

    #game-over {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      flex: 1;
      gap: 12px;
      text-align: center;
      padding-top: 10px;
      overflow-y: auto;
    }

    #result-message {
      font-size: 19px;
      font-weight: 800;
      color: var(--duolingo-dark-green);
      margin: 0;
      padding: 0 5px;
    }

    .score-history-title {
      font-size: 16px;
      font-weight: 700;
      margin-top: 6px;
      margin-bottom: 4px;
      color: #555;
    }

    #score-list {
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
      max-width: 400px;
      max-height: 220px;
      overflow-y: auto;
      border: 2px solid var(--duolingo-gray);
      border-radius: 10px;
      background: #fafafa;
    }

    #score-list li {
      padding: 8px 12px;
      font-size: 15px;
      font-weight: 700;
      border-bottom: 1px solid var(--duolingo-gray);
      display: flex;
      justify-content: space-between;
    }

    #score-list li:last-child {
      border-bottom: none;
    }

    #score-list li.latest-score {
      color: var(--duolingo-green);
      font-weight: 900;
      background-color: #f0fdf0;
    }

    #restart-btn {
      background-color: var(--duolingo-green);
      color: white;
      border: none;
      border-bottom: 4px solid var(--duolingo-dark-green);
      padding: 12px 28px;
      border-radius: 14px;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: auto;
      margin-bottom: 10px;
      transition: opacity 0.2s;
    }

    #restart-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    #restart-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="game-container">
  <header>
    <h1>Nimijahti / metsäkasvit</h1>
    <div class="stats">
      <div id="score">Pisteet: <span id="points">0</span></div>
      <div id="timer">Aika: <span id="time-left">30</span>s</div>
    </div>
  </header>

  <div id="game-board">
    <div class="image-container">
      <img id="plant-image" src="" alt="Kasvi">
    </div>

    <div class="names-container">
      <button class="name-btn" id="btn-0"></button>
      <button class="name-btn" id="btn-1"></button>
      <button class="name-btn" id="btn-2"></button>
      <button class="name-btn" id="btn-3"></button>
      <button class="name-btn" id="btn-4"></button>
      <button class="name-btn" id="btn-5"></button>
    </div>
  </div>

  <div id="game-over">
    <h2 id="result-message"></h2>
    
    <div class="score-history-title">Pistetaulukko (Top 20)</div>
    <ul id="score-list"></ul>

    <button id="restart-btn" onclick="aloitaPeli()">Pelaa uudelleen</button>
  </div>
</div>

<script>
  const kaikkiKasvit = [
    { kuva: "kuvat/Peltosaunio.jpg", nimi: "Peltosaunio" },
    { kuva: "kuvat/Pujo.jpg", nimi: "Pujo" },
    { kuva: "kuvat/Siankärsämö.jpg", nimi: "Siankärsämö" },
    { kuva: "kuvat/Keltakannusruoho.jpg", nimi: "Keltakannusruoho" },
    { kuva: "kuvat/Naava tai luppo.jpg", nimi: "Naava tai luppo" },
    { kuva: "kuvat/Jäkälä.jpg", nimi: "Jäkälä" },
    { kuva: "kuvat/Sammal.jpg", nimi: "Sammal" },
    { kuva: "kuvat/Valkovuokko.jpg", nimi: "Valkovuokko" },
    { kuva: "kuvat/Sinivuokko.jpg", nimi: "Sinivuokko" },
    { kuva: "kuvat/Maitohorsma.jpg", nimi: "Maitohorsma" },
    { kuva: "kuvat/Kangasmaitikka.jpg", nimi: "Kangasmaitikka" },
    { kuva: "kuvat/Metsätähti.jpg", nimi: "Metsätähti" },
    { kuva: "kuvat/Kielo.jpg", nimi: "Kielo" },
    { kuva: "kuvat/Käenkaali.jpg", nimi: "Käenkaali" },
    { kuva: "kuvat/Korte.jpg", nimi: "Korte" },
    { kuva: "kuvat/Lieko.jpg", nimi: "Lieko" },
    { kuva: "kuvat/Saniainen.jpg", nimi: "Saniainen" },
    { kuva: "kuvat/Mustikka.jpg", nimi: "Mustikka" },
    { kuva: "kuvat/Puolukka.jpg", nimi: "Puolukka" },
    { kuva: "kuvat/Kanerva.jpg", nimi: "Kanerva" },
    { kuva: "kuvat/Oravanmarja.jpg", nimi: "Oravanmarja" },
    { kuva: "kuvat/Jalava.jpg", nimi: "Jalava" },
    { kuva: "kuvat/Lehmus.jpg", nimi: "Lehmus" },
    { kuva: "kuvat/Vaahtera.jpg", nimi: "Vaahtera" },
    { kuva: "kuvat/Tuomi.jpg", nimi: "Tuomi" },
    { kuva: "kuvat/Kataja.jpg", nimi: "Kataja" },
    { kuva: "kuvat/Tammi.jpg", nimi: "Tammi" },
    { kuva: "kuvat/Pihlaja.jpg", nimi: "Pihlaja" },
    { kuva: "kuvat/Haapa.jpg", nimi: "Haapa" },
    { kuva: "kuvat/Paju.jpg", nimi: "Paju" },
    { kuva: "kuvat/Harmaaleppä.jpg", nimi: "Harmaaleppä" },
    { kuva: "kuvat/Rauduskoivu.jpg", nimi: "Rauduskoivu" },
    { kuva: "kuvat/Mänty.jpg", nimi: "Mänty" },
    { kuva: "kuvat/Hieskoivu.jpg", nimi: "Hieskoivu" },
    { kuva: "kuvat/Kuusi.jpg", nimi: "Kuusi" }
  ];

  const yhdyssanaMappi = {
    "Peltosaunio": "Pelto-<br>saunio",
    "Siankärsämö": "Sian-<br>kärsämö",
    "Keltakannusruoho": "Kelta-<br>kannusruoho",
    "Naava tai luppo": "Naava tai<br>luppo",
    "Valkovuokko": "Valko-<br>vuokko",
    "Sinivuokko": "Sini-<br>vuokko",
    "Maitohorsma": "Maito-<br>horsma",
    "Kangasmaitikka": "Kangas-<br>maitikka",
    "Metsätähti": "Metsä-<br>tähti",
    "Käenkaali": "Käen-<br>kaali",
    "Oravanmarja": "Oravan-<br>marja",
    "Harmaaleppä": "Harmaa-<br>leppä",
    "Rauduskoivu": "Raudus-<br>koivu",
    "Hieskoivu": "Hies-<br>koivu"
  };

  let pisteet = 0;
  let aikaaJäljellä = 30;
  let kokonaisAika = 0;
  let ajastin = null;
  let delayTimer = null;
  let peliKaynnissa = false;
  let nykyinenOikea = null;
  let edellinenOikea = null;
  let vaaratKerrat = 0;

  function muotoileNimi(nimi) {
    if (window.innerWidth <= 768) {
      if (yhdyssanaMappi[nimi]) {
        return yhdyssanaMappi[nimi];
      }
      if (nimi.includes(' ')) {
        return nimi.replace(' ', '<br>');
      }
    }
    return nimi;
  }

  function laskePainikkeenLeveys() {
    if (window.innerWidth <= 768) return;

    const dummy = document.createElement('div');
    dummy.style.position = 'absolute';
    dummy.style.visibility = 'hidden';
    dummy.style.whiteSpace = 'nowrap';
    dummy.style.fontSize = '15px';
    dummy.style.fontWeight = '700';
    dummy.style.fontFamily = "'din-round', system-ui, -apple-system, sans-serif";
    dummy.style.padding = '0 8px';
    document.body.appendChild(dummy);

    let maxLeveys = 0;
    kaikkiKasvit.forEach(kasvi => {
      dummy.textContent = kasvi.nimi;
      if (dummy.clientWidth > maxLeveys) {
        maxLeveys = dummy.clientWidth;
      }
    });
    document.body.removeChild(dummy);

    const lopullinenLeveys = maxLeveys + 24; 
    document.documentElement.style.setProperty('--btn-width', `${lopullinenLeveys}px`);
  }

  function sekoita(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function aloitaPeli() {
    laskePainikkeenLeveys();
    document.body.classList.remove('flashing');
    pisteet = 0;
    aikaaJäljellä = 30;
    kokonaisAika = 0;
    peliKaynnissa = true;
    edellinenOikea = null;

    document.getElementById('points').innerText = pisteet;
    document.getElementById('time-left').innerText = aikaaJäljellä;
    document.getElementById('game-over').style.display = 'none';
    document.getElementById('game-board').style.display = 'flex';

    uusiKierros();

    clearInterval(ajastin);
    ajastin = setInterval(() => {
      aikaaJäljellä--;
      kokonaisAika++;
      document.getElementById('time-left').innerText = aikaaJäljellä;
      if (aikaaJäljellä <= 0) lopetaPeli();
    }, 1000);
  }

  function uusiKierros() {
    if (!peliKaynnissa) return;

    clearTimeout(delayTimer);
    vaaratKerrat = 0;

    const mahdollisetKasvit = kaikkiKasvit.filter(
      k => !edellinenOikea || k.nimi !== edellinenOikea.nimi
    );

    nykyinenOikea = mahdollisetKasvit[Math.floor(Math.random() * mahdollisetKasvit.length)];
    edellinenOikea = nykyinenOikea;

    const muutKasvit = kaikkiKasvit.filter(k => k.nimi !== nykyinenOikea.nimi);
    const sekoitetutMuut = sekoita(muutKasvit).slice(0, 5);
    const kaikkiKuusi = sekoita([nykyinenOikea, ...sekoitetutMuut]);

    const imgElement = document.getElementById('plant-image');
    imgElement.classList.remove('visible');

    const napit = document.querySelectorAll('.name-btn');
    napit.forEach(nappi => {
      nappi.classList.remove('visible', 'wrong-flash', 'correct-reveal');
      nappi.disabled = true;
    });

    const uusiKuva = new Image();
    let ladattu = false;

    const suoritaFeidaus = () => {
      if (ladattu || !peliKaynnissa) return;
      ladattu = true;
      imgElement.src = nykyinenOikea.kuva;
      void imgElement.offsetWidth; 
      requestAnimationFrame(() => {
        imgElement.classList.add('visible');
      });
    };

    uusiKuva.onload = suoritaFeidaus;
    uusiKuva.src = nykyinenOikea.kuva;

    if (uusiKuva.complete && uusiKuva.naturalWidth !== 0) {
      setTimeout(suoritaFeidaus, 50);
    }

    delayTimer = setTimeout(() => {
      if (!peliKaynnissa) return;

      napit.forEach((nappi, idx) => {
        const kasvi = kaikkiKuusi[idx];
        nappi.innerHTML = muotoileNimi(kasvi.nimi);
        nappi.dataset.nimi = kasvi.nimi;
        nappi.onclick = () => tarkistaValinta(nappi, kasvi.nimi);
        nappi.disabled = false;
        nappi.classList.add('visible');
      });
    }, 3000);
  }

  function tarkistaValinta(nappi, valittuNimi) {
    if (!peliKaynnissa || nappi.disabled) return;

    if (valittuNimi === nykyinenOikea.nimi) {
      pisteet += 2;
      aikaaJäljellä += 4;
      document.getElementById('points').innerText = pisteet;
      document.getElementById('time-left').innerText = aikaaJäljellä;
      uusiKierros();
    } else {
      pisteet -= 1;
      vaaratKerrat++;
      document.getElementById('points').innerText = pisteet;

      if (vaaratKerrat >= 2) {
        const napit = document.querySelectorAll('.name-btn');
        napit.forEach(b => b.disabled = true);

        napit.forEach(b => {
          if (b.dataset.nimi === nykyinenOikea.nimi) {
            b.classList.add('correct-reveal');
          }
        });

        // Oikea vastaus näytetään 1 sekunnin ajan (1000 ms)
        setTimeout(() => {
          if (peliKaynnissa) uusiKierros();
        }, 1000);

      } else {
        nappi.classList.add('wrong-flash');
        nappi.disabled = true;

        setTimeout(() => {
          nappi.classList.remove('wrong-flash');
          nappi.disabled = false;
        }, 500);
      }
    }
  }

  function lopetaPeli() {
    peliKaynnissa = false;
    clearInterval(ajastin);
    clearTimeout(delayTimer);

    document.getElementById('game-board').style.display = 'none';

    const restartBtn = document.getElementById('restart-btn');
    restartBtn.disabled = true;
    setTimeout(() => {
      restartBtn.disabled = false;
    }, 2000);

    const storageKey = 'nimijahti_metsakasvit_pisteet';
    let historia = JSON.parse(localStorage.getItem(storageKey) || '[]');
    const aiempiEnnatys = historia.length > 0 ? Math.max(...historia.map(h => h.pisteet)) : -Infinity;
    const uusiEnnatys = pisteet > aiempiEnnatys && pisteet > 0;

    const uusiTulos = { id: Date.now(), pisteet: pisteet, aika: kokonaisAika };
    historia.push(uusiTulos);

    historia.sort((a, b) => b.pisteet - a.pisteet);
    historia = historia.slice(0, 20);

    localStorage.setItem(storageKey, JSON.stringify(historia));

    const msgElement = document.getElementById('result-message');
    if (uusiEnnatys) {
      msgElement.innerText = `Mahtavaa! Teit ennätyksesi ${pisteet} pistettä!`;
      document.body.classList.add('flashing');
      setTimeout(() => {
        document.body.classList.remove('flashing');
      }, 5000);
    } else {
      msgElement.innerText = `Peli päättyi: sait ${pisteet} pistettä!`;
    }

    const scoreList = document.getElementById('score-list');
    scoreList.innerHTML = '';

    historia.forEach((item, index) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>#${index + 1}</span> <span>${item.pisteet} p (${item.aika}s)</span>`;
      if (item.id === uusiTulos.id) {
        li.className = 'latest-score';
      }
      scoreList.appendChild(li);
    });

    document.getElementById('game-over').style.display = 'flex';
  }

  window.addEventListener('resize', () => {
    laskePainikkeenLeveys();
  });

  window.addEventListener('contextmenu', (e) => e.preventDefault());

  aloitaPeli();
</script>
</body>
</html>
